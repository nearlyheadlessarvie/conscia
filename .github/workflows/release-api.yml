name: Release API

on:
  push:
    tags:
      - 'api/v*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CONSCIA_DOMAIN_NAME: ${{ vars.CONSCIA_DOMAIN_NAME }}
      CONSCIA_WWW_DOMAIN_NAME: ${{ vars.CONSCIA_WWW_DOMAIN_NAME }}
      CONSCIA_API_DOMAIN_NAME: ${{ vars.CONSCIA_API_DOMAIN_NAME }}
      ROUTE53_HOSTED_ZONE_ID: ${{ vars.ROUTE53_HOSTED_ZONE_ID }}
      AUTH_GOOGLE_CLIENT_ID: ${{ secrets.AUTH_GOOGLE_CLIENT_ID }}
      AUTH_APPLE_CLIENT_ID: ${{ secrets.AUTH_APPLE_CLIENT_ID }}
      COGNITO_APPLE_SERVICES_ID: ${{ vars.COGNITO_APPLE_SERVICES_ID }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      COGNITO_APPLE_KEY_ID: ${{ secrets.COGNITO_APPLE_KEY_ID }}
      COGNITO_APPLE_PRIVATE_KEY: ${{ secrets.COGNITO_APPLE_PRIVATE_KEY }}
      APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
      APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
      APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
      GOOGLE_PLAY_PACKAGE_NAME: ${{ vars.GOOGLE_PLAY_PACKAGE_NAME }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
      FIREBASE_ADMIN_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_ADMIN_SERVICE_ACCOUNT_JSON }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      SES_FROM_EMAIL: ${{ vars.SES_FROM_EMAIL }}
      SES_CONFIGURATION_SET: ${{ vars.SES_CONFIGURATION_SET }}
      INVITE_EMAIL_DEEP_LINK_BASE_URI: ${{ vars.INVITE_EMAIL_DEEP_LINK_BASE_URI }}
    steps:
      - name: Validate release ref
        shell: bash
        run: |
          case "${GITHUB_REF}" in
            refs/heads/main|refs/tags/api/v*) ;;
            *)
              echo "::error::Release API must run from main or an api/v* tag. Current ref: ${GITHUB_REF}"
              exit 1
              ;;
          esac

      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore and build
        run: dotnet restore && dotnet build --no-restore

      - name: Run tests
        run: dotnet test --no-build --verbosity normal

      - name: Publish Lambda assets
        run: |
          dotnet publish src/Conscia.Api -c Release -r linux-arm64 --self-contained -o publish/api
          if [[ "${GITHUB_REF:-}" == refs/tags/api/v* ]]; then
            API_VERSION="${GITHUB_REF#refs/tags/api/v}"
          else
            LAST_API_TAG=$(git describe --tags --match 'api/v*' --abbrev=0 2>/dev/null || true)
            REF_NAME=$(printf '%s' "${GITHUB_REF_NAME:-manual}" | sed 's#[/_]#-#g')
            SHORT_SHA="${GITHUB_SHA::7}"
            if [[ -n "$LAST_API_TAG" ]]; then
              API_VERSION="${LAST_API_TAG#api/v}+${REF_NAME}.${SHORT_SHA}"
            else
              API_VERSION="${REF_NAME}.${SHORT_SHA}"
            fi
          fi
          API_DEPLOYED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          export API_VERSION
          export API_DEPLOYED_AT
          python3 -c 'import json, os; from pathlib import Path; Path("publish/api/version.json").write_text(json.dumps({"service": "conscia-api", "version": os.environ["API_VERSION"], "commitSha": os.environ["GITHUB_SHA"], "deployedAt": os.environ["API_DEPLOYED_AT"]}, separators=(",", ":")), encoding="utf-8")'
          dotnet publish src/Conscia.CognitoPreSignupLinker -c Release -r linux-arm64 --self-contained -o publish/cognito-pre-signup-linker
          dotnet publish src/Conscia.OutboxProcessor -c Release -r linux-arm64 --self-contained -o publish/outbox
          dotnet publish src/Conscia.RecurringProcessor -c Release -r linux-arm64 --self-contained -o publish/recurring-processor
          dotnet publish src/Conscia.PatternAggregator -c Release -r linux-arm64 --self-contained -o publish/pattern-aggregator

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-1' }}

      - name: Install CDK
        run: npm install -g aws-cdk

      - name: Deploy API Lambda stacks
        working-directory: infra
        run: |
          dotnet restore
          cdk deploy Conscia-Compute Conscia-Outbox Conscia-RecurringProcessor Conscia-PatternAggregator --require-approval never \
            --parameters "Conscia-Auth:ManagedLoginApplePrivateKey=$COGNITO_APPLE_PRIVATE_KEY"

      - name: Smoke test
        run: |
          API_URL=$(aws cloudformation describe-stacks --stack-name Conscia-Compute --query "Stacks[0].Outputs[?OutputKey=='ApiEndpoint'].OutputValue" --output text)
          if [ -n "${CONSCIA_API_DOMAIN_NAME:-}" ]; then
            curl -sf "https://${CONSCIA_API_DOMAIN_NAME}/health/live" || exit 1
          else
            API_ROOT="${API_URL%/api/}"
            curl -sf "${API_ROOT%/}/health/live" || exit 1
          fi
          echo "Health check passed"

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/api/v}" >> $GITHUB_OUTPUT
