name: Release API

on:
  push:
    tags:
      - 'api/v*'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore and build
        run: dotnet restore && dotnet build --no-restore

      - name: Run tests
        run: dotnet test --no-build --verbosity normal

      - name: Publish API
        run: dotnet publish src/Conscia.Api -c Release -r linux-arm64 --self-contained -o publish/api

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Install CDK
        run: npm install -g aws-cdk

      - name: Deploy ComputeStack
        working-directory: infra
        run: |
          dotnet restore
          cdk deploy Conscia-Compute --require-approval never

      - name: Smoke test
        run: |
          API_URL=$(aws cloudformation describe-stacks --stack-name Conscia-Compute --query "Stacks[0].Outputs[?OutputKey=='ApiEndpoint'].OutputValue" --output text)
          curl -sf "$API_URL/health" || exit 1
          echo "Health check passed"

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/api/v}" >> $GITHUB_OUTPUT
