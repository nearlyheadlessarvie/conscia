name: Release Infrastructure

on:
  push:
    tags:
      - 'infra/v*'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CONSCIA_DOMAIN_NAME: ${{ vars.CONSCIA_DOMAIN_NAME }}
      CONSCIA_WWW_DOMAIN_NAME: ${{ vars.CONSCIA_WWW_DOMAIN_NAME }}
      CONSCIA_API_DOMAIN_NAME: ${{ vars.CONSCIA_API_DOMAIN_NAME }}
      ROUTE53_HOSTED_ZONE_ID: ${{ vars.ROUTE53_HOSTED_ZONE_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build and test infra
        working-directory: infra
        run: |
          dotnet restore
          dotnet build --no-restore
          dotnet test --no-build --verbosity normal

      - name: Publish Lambda assets
        run: |
          dotnet publish src/Conscia.Api -c Release -r linux-arm64 --self-contained -o publish/api
          dotnet publish src/Conscia.OutboxProcessor -c Release -r linux-arm64 --self-contained -o publish/outbox
          dotnet publish src/Conscia.PatternAggregator -c Release -r linux-arm64 --self-contained -o publish/pattern-aggregator

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-1' }}

      - name: Install CDK
        run: npm install -g aws-cdk

      - name: CDK diff (dry run)
        working-directory: infra
        run: cdk diff --all

      - name: Deploy all stacks
        working-directory: infra
        run: cdk deploy --all --require-approval never

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/infra/v}" >> $GITHUB_OUTPUT
