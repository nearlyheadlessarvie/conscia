name: Release Infrastructure

on:
  push:
    tags:
      - 'infra/v*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CONSCIA_DOMAIN_NAME: ${{ vars.CONSCIA_DOMAIN_NAME }}
      CONSCIA_WWW_DOMAIN_NAME: ${{ vars.CONSCIA_WWW_DOMAIN_NAME }}
      CONSCIA_API_DOMAIN_NAME: ${{ vars.CONSCIA_API_DOMAIN_NAME }}
      ROUTE53_HOSTED_ZONE_ID: ${{ vars.ROUTE53_HOSTED_ZONE_ID }}
      CONSCIA_SES_MAIL_FROM_SUBDOMAIN: ${{ vars.CONSCIA_SES_MAIL_FROM_SUBDOMAIN || 'feedback' }}
      CONSCIA_DMARC_RECORD_NAME: ${{ vars.CONSCIA_DMARC_RECORD_NAME || '_dmarc' }}
      CONSCIA_DMARC_VALUE: ${{ vars.CONSCIA_DMARC_VALUE || 'v=DMARC1; p=quarantine; adkim=s; aspf=s; pct=100' }}
      COGNITO_APPLE_SERVICES_ID: ${{ vars.COGNITO_APPLE_SERVICES_ID }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      ICLOUD_INBOX_MX_RECORDS_JSON: ${{ vars.ICLOUD_INBOX_MX_RECORDS_JSON }}
      ICLOUD_INBOX_TXT_RECORDS_JSON: ${{ vars.ICLOUD_INBOX_TXT_RECORDS_JSON }}
      ICLOUD_INBOX_CNAME_RECORDS_JSON: ${{ vars.ICLOUD_INBOX_CNAME_RECORDS_JSON }}
      APPLE_PRIVATE_KEY_SECRET_NAME: conscia/prod/apple-private-key
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_SECRET_NAME: conscia/prod/google-play-service-account-json
      FIREBASE_ADMIN_SERVICE_ACCOUNT_JSON_SECRET_NAME: conscia/prod/firebase-admin-service-account-json
      AUTH_GOOGLE_CLIENT_ID: ${{ secrets.AUTH_GOOGLE_CLIENT_ID }}
      AUTH_APPLE_CLIENT_ID: ${{ secrets.AUTH_APPLE_CLIENT_ID }}
      COGNITO_APPLE_KEY_ID: ${{ secrets.COGNITO_APPLE_KEY_ID }}
      COGNITO_APPLE_PRIVATE_KEY: ${{ secrets.COGNITO_APPLE_PRIVATE_KEY }}
      COGNITO_GOOGLE_CLIENT_SECRET: ${{ secrets.COGNITO_GOOGLE_CLIENT_SECRET }}
      APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
      APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
      APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
      GOOGLE_PLAY_PACKAGE_NAME: ${{ vars.GOOGLE_PLAY_PACKAGE_NAME }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
      FIREBASE_ADMIN_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_ADMIN_SERVICE_ACCOUNT_JSON }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      ADMIN_BOOTSTRAP_EMAILS: ${{ secrets.ADMIN_BOOTSTRAP_EMAILS }}
      SES_FROM_EMAIL: ${{ vars.SES_FROM_EMAIL }}
      SES_CONFIGURATION_SET: ${{ vars.SES_CONFIGURATION_SET }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      BREVO_SENDER_EMAIL: ${{ vars.BREVO_SENDER_EMAIL || vars.SES_FROM_EMAIL }}
      BREVO_SENDER_NAME: ${{ vars.BREVO_SENDER_NAME || 'Conscia' }}
      INVITE_EMAIL_DEEP_LINK_BASE_URI: ${{ vars.INVITE_EMAIL_DEEP_LINK_BASE_URI }}
    steps:
      - name: Validate release ref
        shell: bash
        run: |
          case "${GITHUB_REF}" in
            refs/heads/main|refs/tags/infra/v*) ;;
            *)
              echo "::error::Release Infrastructure must run from main or an infra/v* tag. Current ref: ${GITHUB_REF}"
              exit 1
              ;;
          esac

      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build and test infra
        working-directory: infra
        run: |
          dotnet restore
          dotnet build --no-restore
          dotnet test --no-build --verbosity normal

      - name: Publish Lambda assets
        run: |
          dotnet publish src/Conscia.Api -c Release -r linux-arm64 --self-contained -o publish/api
          dotnet publish src/Conscia.CognitoCustomEmailSender -c Release -r linux-arm64 --self-contained -o publish/cognito-custom-email-sender
          dotnet publish src/Conscia.CognitoPreSignupLinker -c Release -r linux-arm64 --self-contained -o publish/cognito-pre-signup-linker
          dotnet publish src/Conscia.OutboxProcessor -c Release -r linux-arm64 --self-contained -o publish/outbox
          dotnet publish src/Conscia.RecurringProcessor -c Release -r linux-arm64 --self-contained -o publish/recurring-processor
          dotnet publish src/Conscia.PatternAggregator -c Release -r linux-arm64 --self-contained -o publish/pattern-aggregator

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-1' }}

      - name: Install CDK
        run: npm install -g aws-cdk

      - name: Sync runtime secrets
        shell: bash
        run: |
          set -euo pipefail

          upsert_secret() {
            local name="$1"
            local value="$2"

            if [[ -z "$value" ]]; then
              echo "::error::Secret value for $name is empty"
              exit 1
            fi

            if aws secretsmanager describe-secret --secret-id "$name" >/dev/null 2>&1; then
              aws secretsmanager put-secret-value --secret-id "$name" --secret-string "$value" >/dev/null
            else
              aws secretsmanager create-secret --name "$name" --secret-string "$value" >/dev/null
            fi
          }

          upsert_secret "$APPLE_PRIVATE_KEY_SECRET_NAME" "$APPLE_PRIVATE_KEY"
          upsert_secret "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_SECRET_NAME" "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"
          upsert_secret "$FIREBASE_ADMIN_SERVICE_ACCOUNT_JSON_SECRET_NAME" "$FIREBASE_ADMIN_SERVICE_ACCOUNT_JSON"

      - name: CDK diff (dry run)
        working-directory: infra
        run: >
          cdk diff
          --parameters "Conscia-Auth:ManagedLoginGoogleClientSecret=$COGNITO_GOOGLE_CLIENT_SECRET"
          --parameters "Conscia-Auth:ManagedLoginApplePrivateKey=$COGNITO_APPLE_PRIVATE_KEY"
          --parameters "Conscia-Compute:AdminBootstrapEmails=$ADMIN_BOOTSTRAP_EMAILS"

      - name: Deploy all stacks
        working-directory: infra
        run: >
          cdk deploy --all --require-approval never
          --parameters "Conscia-Auth:ManagedLoginGoogleClientSecret=$COGNITO_GOOGLE_CLIENT_SECRET"
          --parameters "Conscia-Auth:ManagedLoginApplePrivateKey=$COGNITO_APPLE_PRIVATE_KEY"
          --parameters "Conscia-Compute:AdminBootstrapEmails=$ADMIN_BOOTSTRAP_EMAILS"

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/infra/v}" >> $GITHUB_OUTPUT
