name: Sync App Release Metadata

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - labeled

permissions:
  contents: write
  pull-requests: read

jobs:
  sync-app-release-metadata:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Detect app release PR
        id: detect
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $isReleaseTitle = "${{ github.event.pull_request.title }}" -match '^chore\([^)]+\): release'
          if (-not $isReleaseTitle) {
            "is_app_release=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $changedFiles = gh api `
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" `
            --paginate `
            --jq '.[].filename'
          $touchesAppVersion = $changedFiles -contains 'app/pubspec.yaml'
          if ($isReleaseTitle -and $touchesAppVersion) {
            "is_app_release=true" >> $env:GITHUB_OUTPUT
          } else {
            "is_app_release=false" >> $env:GITHUB_OUTPUT
          }

      - uses: actions/checkout@v4
        if: steps.detect.outputs.is_app_release == 'true'
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Sync compatibility window
        if: steps.detect.outputs.is_app_release == 'true'
        shell: pwsh
        run: ./scripts/update-app-release-metadata.ps1

      - name: Commit metadata updates
        if: steps.detect.outputs.is_app_release == 'true'
        shell: pwsh
        run: |
          if (-not (git diff --quiet)) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/Conscia.Api/appsettings.json src/Conscia.Api/appsettings.Development.json src/Conscia.Api/Versioning/AppCompatibilityOptions.cs
            git commit -m "chore(app): sync compatibility metadata"
            git push
          }
