name: Release Flutter App

on:
  push:
    tags:
      - 'app/v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_DIR: app
  API_BASE_URL: ${{ vars.API_BASE_URL }}
  MOCK_AUTH: ${{ vars.MOCK_AUTH || 'false' }}
  PUSH_NOTIFICATIONS_ENABLED: ${{ vars.PUSH_NOTIFICATIONS_ENABLED || 'false' }}
  GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
  FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GOOGLE_PLAY_DEPLOY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_DEPLOY_SERVICE_ACCOUNT_JSON }}
      GOOGLE_PLAY_PACKAGE_NAME: ${{ vars.GOOGLE_PLAY_PACKAGE_NAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable

      - name: Validate Android release secrets
        shell: bash
        run: |
          test -n "${API_BASE_URL}" || (echo "Missing API_BASE_URL variable" && exit 1)
          test -n "${GOOGLE_SERVER_CLIENT_ID}" || (echo "Missing GOOGLE_SERVER_CLIENT_ID secret" && exit 1)
          test -n "${ANDROID_GOOGLE_SERVICES_JSON_BASE64}" || (echo "Missing ANDROID_GOOGLE_SERVICES_JSON_BASE64 secret" && exit 1)
          test -n "${ANDROID_KEYSTORE_BASE64}" || (echo "Missing ANDROID_KEYSTORE_BASE64 secret" && exit 1)
          test -n "${ANDROID_KEYSTORE_PASSWORD}" || (echo "Missing ANDROID_KEYSTORE_PASSWORD secret" && exit 1)
          test -n "${ANDROID_KEY_ALIAS}" || (echo "Missing ANDROID_KEY_ALIAS secret" && exit 1)
          test -n "${ANDROID_KEY_PASSWORD}" || (echo "Missing ANDROID_KEY_PASSWORD secret" && exit 1)
          test -n "${GOOGLE_PLAY_DEPLOY_SERVICE_ACCOUNT_JSON}" || (echo "Missing GOOGLE_PLAY_DEPLOY_SERVICE_ACCOUNT_JSON secret" && exit 1)
          test -n "${GOOGLE_PLAY_PACKAGE_NAME}" || (echo "Missing GOOGLE_PLAY_PACKAGE_NAME variable" && exit 1)

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Generate Flutter code
        working-directory: app
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Materialize Android Firebase config
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          import os

          Path("app/android/app/google-services.json").write_bytes(
              base64.b64decode(os.environ["ANDROID_GOOGLE_SERVICES_JSON_BASE64"])
          )
          PY

      - name: Materialize optional firebase_options.dart override
        if: env.FIREBASE_OPTIONS_DART_BASE64 != ''
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          import os

          Path("app/lib/firebase_options.dart").write_bytes(
              base64.b64decode(os.environ["FIREBASE_OPTIONS_DART_BASE64"])
          )
          PY

      - name: Materialize Android signing assets
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          import os

          Path("app/android/conscia-release.jks").write_bytes(
              base64.b64decode(os.environ["ANDROID_KEYSTORE_BASE64"])
          )
          PY
          cat > app/android/key.properties <<EOF
          storeFile=conscia-release.jks
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF

      - name: Run tests
        working-directory: app
        run: flutter test

      - name: Build signed Android App Bundle
        working-directory: app
        run: |
          flutter build appbundle --release \
            --dart-define=API_BASE_URL="${API_BASE_URL}" \
            --dart-define=MOCK_AUTH="${MOCK_AUTH}" \
            --dart-define=PUSH_NOTIFICATIONS_ENABLED="${PUSH_NOTIFICATIONS_ENABLED}" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="${GOOGLE_SERVER_CLIENT_ID}"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: app/build/app/outputs/bundle/release/app-release.aab

      - name: Upload to Google Play internal track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_DEPLOY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ vars.GOOGLE_PLAY_PACKAGE_NAME }}
          releaseFiles: app/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

  build-ios:
    runs-on: macos-latest
    env:
      IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
      MATCH_GIT_URL: ${{ vars.MATCH_GIT_URL }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-ios
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable

      - name: Validate iOS release secrets
        shell: bash
        run: |
          test -n "${API_BASE_URL}" || (echo "Missing API_BASE_URL variable" && exit 1)
          test -n "${GOOGLE_SERVER_CLIENT_ID}" || (echo "Missing GOOGLE_SERVER_CLIENT_ID secret" && exit 1)
          test -n "${IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64}" || (echo "Missing IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 secret" && exit 1)
          test -n "${APP_STORE_CONNECT_API_KEY_ID}" || (echo "Missing APP_STORE_CONNECT_API_KEY_ID secret" && exit 1)
          test -n "${APP_STORE_CONNECT_ISSUER_ID}" || (echo "Missing APP_STORE_CONNECT_ISSUER_ID secret" && exit 1)
          test -n "${APP_STORE_CONNECT_API_PRIVATE_KEY}" || (echo "Missing APP_STORE_CONNECT_API_PRIVATE_KEY secret" && exit 1)
          test -n "${IOS_BUNDLE_ID}" || (echo "Missing IOS_BUNDLE_ID variable" && exit 1)
          test -n "${MATCH_GIT_URL}" || (echo "Missing MATCH_GIT_URL variable" && exit 1)
          test -n "${MATCH_PASSWORD}" || (echo "Missing MATCH_PASSWORD secret" && exit 1)
          test -n "${MATCH_GIT_BASIC_AUTHORIZATION}" || (echo "Missing MATCH_GIT_BASIC_AUTHORIZATION secret" && exit 1)

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Generate Flutter code
        working-directory: app
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Materialize iOS Firebase config
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          import os

          Path("app/ios/Runner/GoogleService-Info.plist").write_bytes(
              base64.b64decode(os.environ["IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64"])
          )
          PY

      - name: Configure iOS Google Sign-In metadata
        working-directory: app
        run: |
          dart run tool/configure_google_sign_in_ios.dart \
            --info-plist ios/Runner/Info.plist \
            --google-service-info-plist ios/Runner/GoogleService-Info.plist \
            --server-client-id "${GOOGLE_SERVER_CLIENT_ID}"

      - name: Materialize optional firebase_options.dart override
        if: env.FIREBASE_OPTIONS_DART_BASE64 != ''
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          import os

          Path("app/lib/firebase_options.dart").write_bytes(
              base64.b64decode(os.environ["FIREBASE_OPTIONS_DART_BASE64"])
          )
          PY

      - name: Install Fastlane
        shell: bash
        run: |
          gem install fastlane --no-document

      - name: Install App Store Connect API key
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          api_key = {
              "key_id": os.environ["APP_STORE_CONNECT_API_KEY_ID"],
              "issuer_id": os.environ["APP_STORE_CONNECT_ISSUER_ID"],
              "key": os.environ["APP_STORE_CONNECT_API_PRIVATE_KEY"],
              "duration": 1200,
              "in_house": False,
          }
          Path(os.environ["RUNNER_TEMP"], "appstore_api_key.json").write_text(
              json.dumps(api_key),
              encoding="utf-8",
          )
          PY

      - name: Install iOS signing assets with Match
        shell: bash
        run: |
          KEYCHAIN_NAME="app-signing.keychain-db"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_NAME"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security list-keychains -d user -s "$KEYCHAIN_NAME" login.keychain-db

          fastlane match appstore \
            --readonly \
            --git_url "$MATCH_GIT_URL" \
            --git_basic_authorization "$MATCH_GIT_BASIC_AUTHORIZATION" \
            --app_identifier "$IOS_BUNDLE_ID" \
            --api_key_path "$RUNNER_TEMP/appstore_api_key.json" \
            --keychain_name "$KEYCHAIN_NAME" \
            --keychain_password "$KEYCHAIN_PASSWORD"

          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"

      - name: Derive provisioning profile metadata
        id: profile
        shell: bash
        run: |
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          PROFILE_PATH=""
          PROFILE_DIRS=(
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
            "$HOME/Library/MobileDevice/Provisioning Profiles"
          )

          for profile_dir in "${PROFILE_DIRS[@]}"; do
            for candidate in "$profile_dir"/*.mobileprovision; do
              test -f "$candidate" || continue
              security cms -D -i "$candidate" > "$PROFILE_PLIST"
              APP_IDENTIFIER=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST" 2>/dev/null || true)
              if [[ "$APP_IDENTIFIER" == *".${IOS_BUNDLE_ID}" ]]; then
                PROFILE_PATH="$candidate"
                break 2
              fi
            done
          done

          test -n "$PROFILE_PATH" || (
            echo "No provisioning profile found for ${IOS_BUNDLE_ID}" &&
            find "$HOME/Library" -path "*/Provisioning Profiles/*.mobileprovision" -maxdepth 6 -print 2>/dev/null &&
            exit 1
          )
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST")
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")
          echo "name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"
          echo "team_id=$TEAM_ID" >> "$GITHUB_OUTPUT"
          echo "uuid=$PROFILE_UUID" >> "$GITHUB_OUTPUT"

      - name: Generate export options
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${{ steps.profile.outputs.team_id }}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${IOS_BUNDLE_ID}</key>
              <string>${{ steps.profile.outputs.name }}</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF

      - name: Run tests
        working-directory: app
        run: flutter test

      - name: Prepare Flutter iOS configuration
        working-directory: app
        run: |
          flutter build ios --release --config-only \
            --no-codesign \
            --dart-define=API_BASE_URL="${API_BASE_URL}" \
            --dart-define=MOCK_AUTH="${MOCK_AUTH}" \
            --dart-define=PUSH_NOTIFICATIONS_ENABLED="${PUSH_NOTIFICATIONS_ENABLED}" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="${GOOGLE_SERVER_CLIENT_ID}"

      - name: Archive signed iOS app
        working-directory: app
        shell: bash
        run: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/ios/archive/Runner.xcarchive \
            -destination generic/platform=iOS \
            DEVELOPMENT_TEAM="${{ steps.profile.outputs.team_id }}" \
            CODE_SIGN_STYLE=Automatic \
            PRODUCT_BUNDLE_IDENTIFIER="${IOS_BUNDLE_ID}" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            archive

      - name: Export signed IPA
        working-directory: app
        shell: bash
        run: |
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath build/ios/ipa

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: app/build/ios/ipa/*.ipa

      - name: Resolve IPA path
        id: ipa
        shell: bash
        run: |
          IPA_PATH=$(find app/build/ios/ipa -maxdepth 1 -name "*.ipa" | head -n 1)
          test -n "$IPA_PATH" || (echo "No IPA was exported" && exit 1)
          echo "path=$IPA_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v4
        with:
          app-path: ${{ steps.ipa.outputs.path }}
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
          backend: AppStoreAPI
          wait-for-processing: true

      - name: Clean up iOS signing assets
        if: ${{ always() }}
        shell: bash
        run: |
          security delete-keychain app-signing.keychain-db || true
          rm -f "$RUNNER_TEMP/appstore_api_key.json" || true

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/app/v}" >> $GITHUB_OUTPUT
