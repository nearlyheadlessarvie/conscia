name: Release Flutter App

on:
  push:
    tags:
      - 'app/v*'
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to release
        required: true
        default: both
        type: choice
        options:
          - both
          - android
          - ios
      upload_to_play:
        description: Upload Android build to Google Play
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  APP_DIR: app
  API_BASE_URL: ${{ vars.API_BASE_URL }}
  COGNITO_CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}
  MOCK_AUTH: ${{ vars.MOCK_AUTH || 'false' }}
  PUSH_NOTIFICATIONS_ENABLED: ${{ vars.PUSH_NOTIFICATIONS_ENABLED || 'false' }}
  FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}

jobs:
  build-android:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'both' || inputs.platform == 'android'
    runs-on: ubuntu-latest
    env:
      ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GOOGLE_PLAY_DEPLOY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_DEPLOY_SERVICE_ACCOUNT_JSON }}
      GOOGLE_PLAY_PACKAGE_NAME: ${{ vars.GOOGLE_PLAY_PACKAGE_NAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable

      - name: Validate Android release secrets
        shell: bash
        run: |
          test -n "${API_BASE_URL}" || (echo "Missing API_BASE_URL variable" && exit 1)
          test -n "${COGNITO_CLIENT_ID}" || (echo "Missing COGNITO_CLIENT_ID variable" && exit 1)
          test -n "${ANDROID_GOOGLE_SERVICES_JSON_BASE64}" || (echo "Missing ANDROID_GOOGLE_SERVICES_JSON_BASE64 secret" && exit 1)
          test -n "${ANDROID_KEYSTORE_BASE64}" || (echo "Missing ANDROID_KEYSTORE_BASE64 secret" && exit 1)
          test -n "${ANDROID_KEYSTORE_PASSWORD}" || (echo "Missing ANDROID_KEYSTORE_PASSWORD secret" && exit 1)
          test -n "${ANDROID_KEY_ALIAS}" || (echo "Missing ANDROID_KEY_ALIAS secret" && exit 1)
          test -n "${ANDROID_KEY_PASSWORD}" || (echo "Missing ANDROID_KEY_PASSWORD secret" && exit 1)
          test -n "${GOOGLE_PLAY_DEPLOY_SERVICE_ACCOUNT_JSON}" || (echo "Missing GOOGLE_PLAY_DEPLOY_SERVICE_ACCOUNT_JSON secret" && exit 1)
          test -n "${GOOGLE_PLAY_PACKAGE_NAME}" || (echo "Missing GOOGLE_PLAY_PACKAGE_NAME variable" && exit 1)

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Generate Flutter code
        working-directory: app
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Materialize Android Firebase config
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          import os

          Path("app/android/app/google-services.json").write_bytes(
              base64.b64decode(os.environ["ANDROID_GOOGLE_SERVICES_JSON_BASE64"])
          )
          PY

      - name: Validate Android Firebase config
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          package_name = os.environ["GOOGLE_PLAY_PACKAGE_NAME"]
          config = json.loads(Path("app/android/app/google-services.json").read_text())
          clients = config.get("client", [])

          matching_clients = [
              client for client in clients
              if client.get("client_info", {})
                  .get("android_client_info", {})
                  .get("package_name") == package_name
          ]

          if not matching_clients:
              raise SystemExit(
                  f'google-services.json does not contain package "{package_name}"'
              )

          print(f'Validated Android Firebase config for {package_name}')
          PY

      - name: Materialize optional firebase_options.dart override
        if: env.FIREBASE_OPTIONS_DART_BASE64 != ''
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          import os

          Path("app/lib/firebase_options.dart").write_bytes(
              base64.b64decode(os.environ["FIREBASE_OPTIONS_DART_BASE64"])
          )
          PY

      - name: Materialize Android signing assets
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          import os

          Path("app/android/conscia-release.jks").write_bytes(
              base64.b64decode(os.environ["ANDROID_KEYSTORE_BASE64"])
          )
          PY
          cat > app/android/key.properties <<EOF
          storeFile=conscia-release.jks
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF

      - name: Run tests
        working-directory: app
        run: flutter test

      - name: Build signed Android App Bundle
        working-directory: app
        run: |
          flutter build appbundle --release \
            --dart-define=API_BASE_URL="${API_BASE_URL}" \
            --dart-define=COGNITO_CLIENT_ID="${COGNITO_CLIENT_ID}" \
            --dart-define=MOCK_AUTH="${MOCK_AUTH}" \
            --dart-define=PUSH_NOTIFICATIONS_ENABLED="${PUSH_NOTIFICATIONS_ENABLED}"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: app/build/app/outputs/bundle/release/app-release.aab

      - name: Upload to Google Play internal track
        if: github.event_name == 'push' || inputs.upload_to_play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_DEPLOY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ vars.GOOGLE_PLAY_PACKAGE_NAME }}
          releaseFiles: app/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

  build-ios:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'both' || inputs.platform == 'ios'
    runs-on: macos-latest
    env:
      IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
      MATCH_GIT_URL: ${{ vars.MATCH_GIT_URL }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-ios
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable

      - name: Validate iOS release secrets
        shell: bash
        run: |
          test -n "${API_BASE_URL}" || (echo "Missing API_BASE_URL variable" && exit 1)
          test -n "${COGNITO_CLIENT_ID}" || (echo "Missing COGNITO_CLIENT_ID variable" && exit 1)
          test -n "${IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64}" || (echo "Missing IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 secret" && exit 1)
          test -n "${APP_STORE_CONNECT_API_KEY_ID}" || (echo "Missing APP_STORE_CONNECT_API_KEY_ID secret" && exit 1)
          test -n "${APP_STORE_CONNECT_ISSUER_ID}" || (echo "Missing APP_STORE_CONNECT_ISSUER_ID secret" && exit 1)
          test -n "${APP_STORE_CONNECT_API_PRIVATE_KEY}" || (echo "Missing APP_STORE_CONNECT_API_PRIVATE_KEY secret" && exit 1)
          test -n "${IOS_BUNDLE_ID}" || (echo "Missing IOS_BUNDLE_ID variable" && exit 1)
          test -n "${MATCH_GIT_URL}" || (echo "Missing MATCH_GIT_URL variable" && exit 1)
          test -n "${MATCH_PASSWORD}" || (echo "Missing MATCH_PASSWORD secret" && exit 1)
          test -n "${MATCH_GIT_BASIC_AUTHORIZATION}" || (echo "Missing MATCH_GIT_BASIC_AUTHORIZATION secret" && exit 1)

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Generate Flutter code
        working-directory: app
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Materialize iOS Firebase config
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          import os

          Path("app/ios/Runner/GoogleService-Info.plist").write_bytes(
              base64.b64decode(os.environ["IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64"])
          )
          PY

      - name: Materialize optional firebase_options.dart override
        if: env.FIREBASE_OPTIONS_DART_BASE64 != ''
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          import os

          Path("app/lib/firebase_options.dart").write_bytes(
              base64.b64decode(os.environ["FIREBASE_OPTIONS_DART_BASE64"])
          )
          PY

      - name: Install Fastlane
        shell: bash
        run: |
          gem install fastlane --no-document

      - name: Select Xcode 26
        shell: bash
        run: |
          XCODE_APP=$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort -V | tail -n 1)
          test -n "$XCODE_APP" || (echo "No Xcode 26 installation found on runner" && exit 1)
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Run tests
        working-directory: app
        run: flutter test

      - name: Prepare Flutter iOS configuration
        working-directory: app
        run: |
          flutter build ios --release --config-only \
            --no-codesign \
            --dart-define=API_BASE_URL="${API_BASE_URL}" \
            --dart-define=COGNITO_CLIENT_ID="${COGNITO_CLIENT_ID}" \
            --dart-define=MOCK_AUTH="${MOCK_AUTH}" \
            --dart-define=PUSH_NOTIFICATIONS_ENABLED="${PUSH_NOTIFICATIONS_ENABLED}"

      - name: Build and upload iOS release with Fastlane
        working-directory: app/ios
        shell: bash
        run: fastlane ios release

      - name: Validate archived iOS auth configuration
        shell: bash
        run: |
          APP_BUNDLE="app/build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app"
          INFO_PLIST="$APP_BUNDLE/Info.plist"
          GOOGLE_PLIST="$APP_BUNDLE/GoogleService-Info.plist"

          test -f "$GOOGLE_PLIST" || (echo "Runner.app is missing GoogleService-Info.plist" && exit 1)

          codesign -d --entitlements :- "$APP_BUNDLE" > entitlements.plist 2>/dev/null
          grep -q 'webcredentials:getconscia.com' entitlements.plist || (echo "Runner.app entitlements are missing webcredentials:getconscia.com" && exit 1)
          grep -q 'applinks:getconscia.com' entitlements.plist || (echo "Runner.app entitlements are missing applinks:getconscia.com" && exit 1)

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: app/build/ios/ipa/*.ipa

      - name: Clean up iOS signing assets
        if: ${{ always() }}
        shell: bash
        run: |
          security delete-keychain app-signing.keychain-db || true
