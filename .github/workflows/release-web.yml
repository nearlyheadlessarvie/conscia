name: Release Marketing Site

on:
  push:
    tags:
      - 'web/v*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CONSCIA_DOMAIN_NAME: ${{ vars.CONSCIA_DOMAIN_NAME }}
      CONSCIA_WWW_DOMAIN_NAME: ${{ vars.CONSCIA_WWW_DOMAIN_NAME }}
      ROUTE53_HOSTED_ZONE_ID: ${{ vars.ROUTE53_HOSTED_ZONE_ID }}
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
      GOOGLE_PLAY_PACKAGE_NAME: ${{ vars.GOOGLE_PLAY_PACKAGE_NAME }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      ANDROID_PASSKEY_SHA256_CERT_FINGERPRINTS: ${{ vars.ANDROID_PASSKEY_SHA256_CERT_FINGERPRINTS }}
      REQUIRE_PASSKEY_ASSOCIATIONS: 'true'
    steps:
      - name: Validate release ref
        shell: bash
        run: |
          case "${GITHUB_REF}" in
            refs/heads/main|refs/tags/web/v*) ;;
            *)
              echo "::error::Release Marketing Site must run from main or a web/v* tag. Current ref: ${GITHUB_REF}"
              exit 1
              ;;
          esac

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install and build
        working-directory: web
        run: |
          npm ci
          npm run generate:passkey-associations
          npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-1' }}

      - name: Get S3 bucket and distribution ID
        id: infra
        run: |
          BUCKET=$(aws cloudformation describe-stacks --stack-name Conscia-Web --query "Stacks[0].Outputs[?ExportName=='ConsciWebBucket'].OutputValue" --output text)
          DIST_ID=$(aws cloudformation describe-stacks --stack-name Conscia-Web --query "Stacks[0].Outputs[?ExportName=='ConsciaWebDistributionId'].OutputValue" --output text)
          echo "bucket=$BUCKET" >> $GITHUB_OUTPUT
          echo "dist_id=$DIST_ID" >> $GITHUB_OUTPUT

      - name: Deploy to S3
        run: aws s3 sync web/dist/ s3://${{ steps.infra.outputs.bucket }} --delete

      - name: Set Apple association content type
        run: |
          aws s3 cp \
            web/dist/.well-known/apple-app-site-association \
            s3://${{ steps.infra.outputs.bucket }}/.well-known/apple-app-site-association \
            --content-type application/json \
            --metadata-directive REPLACE

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.infra.outputs.dist_id }} \
            --paths "/*"

      - name: Smoke test
        run: |
          DOMAIN="${CONSCIA_DOMAIN_NAME:-}"
          if [ -z "$DOMAIN" ]; then
            DOMAIN=$(aws cloudformation describe-stacks --stack-name Conscia-Web --query "Stacks[0].Outputs[?ExportName=='ConsciaWebDomain'].OutputValue" --output text)
          fi
          curl -sf "https://$DOMAIN" || exit 1
          curl -sf "https://$DOMAIN/.well-known/apple-app-site-association" | grep -q '"webcredentials"' || exit 1
          curl -sf "https://$DOMAIN/.well-known/assetlinks.json" | grep -q '"delegate_permission/common.get_login_creds"' || exit 1
          echo "Site is live"
          echo "Passkey and deep-link association files are live"

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/web/v}" >> $GITHUB_OUTPUT
