<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta
    name="description"
    content="Conscia is your financial conscience: a sharper pre-purchase assistant, reflective spending insights, and budget-aware guidance with personality."
  >
  <meta name="theme-color" content="#091A38">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Conscia">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Conscia</title>
  <link rel="manifest" href="manifest.json">

  <style>
    :root {
      color-scheme: light;
      --navy: #091a38;
      --paper: #f6f7fb;
      --text: #171a26;
      --muted: #667085;
      --devil: #8c1d18;
      --devil-glow: #d75a45;
      --angel: #79e2df;
      --angel-deep: #0f7e8d;
      --halo: #ffe27a;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at top, rgba(121, 226, 223, 0.18), transparent 30%),
        linear-gradient(180deg, #ffffff 0%, var(--paper) 100%);
      font-family: Inter, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
    }

    #loading-shell {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      z-index: 9999;
      transition: opacity 260ms ease;
    }

    #loading-shell.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-card {
      width: min(440px, 100%);
      text-align: center;
      padding: 32px 28px;
      border-radius: 32px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(9, 26, 56, 0.08);
      box-shadow: 0 24px 56px rgba(9, 26, 56, 0.1);
      backdrop-filter: blur(18px);
    }

    .mark {
      width: 116px;
      height: 116px;
      margin: 0 auto 24px;
      border-radius: 50%;
      position: relative;
      background: linear-gradient(135deg, var(--devil) 0%, #641114 48%, var(--angel-deep) 52%, var(--angel) 100%);
      border: 8px solid var(--navy);
      overflow: hidden;
      animation: settle 1.8s ease-in-out infinite alternate;
    }

    .mark::before,
    .mark::after {
      content: "";
      position: absolute;
      border-radius: 999px;
    }

    .mark::before {
      inset: 18% 44% 18% 14%;
      border-left: 6px solid #ffc8a2;
      border-top: 6px solid #ffc8a2;
      transform: rotate(-12deg);
      border-right: 0;
      border-bottom: 0;
      filter: drop-shadow(0 0 8px rgba(255, 141, 97, 0.2));
    }

    .mark::after {
      inset: 18% 14% 18% 44%;
      border-right: 6px solid #063a52;
      border-top: 6px solid #063a52;
      transform: scaleX(-1) rotate(-14deg);
      border-left: 0;
      border-bottom: 0;
    }

    .spark,
    .halo {
      position: absolute;
      border-radius: 999px;
    }

    .spark {
      width: 14px;
      height: 14px;
      left: 58px;
      bottom: 24px;
      background: radial-gradient(circle, #ffb477 0%, #ff6c2f 72%);
      animation: pulse 1.5s ease-in-out infinite;
    }

    .halo {
      width: 26px;
      height: 12px;
      right: 14px;
      top: 14px;
      border: 4px solid var(--halo);
      border-bottom: 0;
      transform: rotate(18deg);
    }

    h1 {
      margin: 0;
      font-size: 34px;
      line-height: 1.02;
      color: var(--text);
      letter-spacing: -0.03em;
    }

    p {
      margin: 14px auto 0;
      max-width: 32ch;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }

    .status {
      margin-top: 24px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--navy);
      font-weight: 600;
      font-size: 14px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--angel) 0%, var(--angel-deep) 100%);
      box-shadow: 0 0 0 8px rgba(121, 226, 223, 0.16);
      animation: pulse 1.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(0.92); opacity: 0.82; }
      50% { transform: scale(1.08); opacity: 1; }
    }

    @keyframes settle {
      0% { transform: translateY(0) rotate(-1deg); }
      100% { transform: translateY(-4px) rotate(1deg); }
    }
  </style>
</head>
<body>
  <div id="loading-shell">
    <div class="loading-card">
      <div class="mark" aria-hidden="true">
        <span class="halo"></span>
        <span class="spark"></span>
      </div>
      <h1>Meet your<br>financial conscience</h1>
      <p>
        Conscia weighs impulse, reason, and reflection to help you spend more intentionally.
      </p>
      <div class="status">
        <span class="status-dot"></span>
        Loading Conscia
      </div>
    </div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var shell = document.getElementById('loading-shell');
      if (!shell) return;
      shell.classList.add('is-hidden');
      window.setTimeout(function () {
        shell.remove();
      }, 280);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
