<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta
    name="description"
    content="Conscia is your financial conscience: a sharper pre-purchase assistant, reflective spending insights, and budget-aware guidance with personality."
  >
  <meta name="theme-color" content="#091A38">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Conscia">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Conscia</title>
  <link rel="manifest" href="manifest.json">

  <style>
    :root {
      color-scheme: light;
      --navy: #091a38;
      --paper: #f6f7fb;
      --text: #171a26;
      --muted: #667085;
      --angel: #79e2df;
      --angel-deep: #0f7e8d;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at top, rgba(121, 226, 223, 0.18), transparent 30%),
        linear-gradient(180deg, #ffffff 0%, var(--paper) 100%);
      font-family: Inter, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
    }

    #loading-shell {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      z-index: 9999;
      transition: opacity 260ms ease;
    }

    #loading-shell.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-card {
      width: min(440px, 100%);
      text-align: center;
      padding: 32px 28px;
      border-radius: 32px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(9, 26, 56, 0.08);
      box-shadow: 0 24px 56px rgba(9, 26, 56, 0.1);
      backdrop-filter: blur(18px);
    }

    .mark {
      width: 116px;
      height: 116px;
      margin: 0 auto 24px;
      position: relative;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background:
        radial-gradient(circle at 28% 50%, rgba(255, 91, 74, 0.26), transparent 38%),
        radial-gradient(circle at 72% 50%, rgba(121, 226, 223, 0.3), transparent 40%),
        rgba(255, 255, 255, 0.6);
      box-shadow:
        0 10px 24px rgba(9, 26, 56, 0.08),
        inset 0 0 0 1px rgba(9, 26, 56, 0.08);
    }

    .mark img {
      width: 88px;
      height: 88px;
      display: block;
      animation: breathe 1.8s ease-in-out infinite;
    }

    h1 {
      margin: 0;
      font-size: 34px;
      line-height: 1.02;
      color: var(--text);
      letter-spacing: -0.03em;
    }

    p {
      margin: 14px auto 0;
      max-width: 32ch;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }

    .status {
      margin-top: 24px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--navy);
      font-weight: 600;
      font-size: 14px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--angel) 0%, var(--angel-deep) 100%);
      box-shadow: 0 0 0 8px rgba(121, 226, 223, 0.16);
      animation: pulse 1.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(0.92); opacity: 0.82; }
      50% { transform: scale(1.08); opacity: 1; }
    }

    @keyframes breathe {
      0%, 100% { transform: scale(0.98); }
      50% { transform: scale(1.02); }
    }
  </style>
</head>
<body>
  <div id="loading-shell">
    <div class="loading-card">
      <div class="mark" aria-hidden="true">
        <img src="assets/images/app_icon.svg" alt="">
      </div>
      <h1>Meet your<br>financial conscience</h1>
      <p>
        Conscia weighs impulse, reason, and reflection to help you spend more intentionally.
      </p>
      <div class="status">
        <span class="status-dot"></span>
        Loading Conscia
      </div>
    </div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var shell = document.getElementById('loading-shell');
      if (!shell) return;
      shell.classList.add('is-hidden');
      window.setTimeout(function () {
        shell.remove();
      }, 280);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
