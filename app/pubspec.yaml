name: conscia_app
description: Your Financial Conscience - AI-powered financial assistant
publish_to: 'none'
version: 2.1.0+14

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.0
  dio: ^5.4.3+1
  app_links: ^7.0.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  flutter_secure_storage: ^9.0.0
  google_fonts: ^6.2.1
  intl: ^0.19.0
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  shared_preferences: ^2.3.4
  image_picker: ^1.1.2
  in_app_purchase: ^3.2.0
  share_plus: ^12.0.2
  speech_to_text: ^7.0.0
  url_launcher: ^6.3.2
  flutter_web_auth_2: ^5.0.2
  package_info_plus: ^8.1.3
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0
  flutter_slidable: 4.0.3
  connectivity_plus: 6.1.5
  new_version_plus: ^0.1.1
  hugeicons: ^1.1.0
  passkeys: ^2.17.4
  geolocator: ^14.0.2
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.7.1
  riverpod_generator: ^2.4.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/images/sprites/angel/
    - assets/images/sprites/devil/
    - assets/images/sprites/money/
  fonts:
    - family: Conscia
      fonts:
        - asset: assets/fonts/conscia/Conscia.ttf
