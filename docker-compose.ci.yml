services:
  postgres:
    image: postgres:16.6-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: conscia
      POSTGRES_USER: conscia
      POSTGRES_PASSWORD: conscia_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conscia"]
      interval: 5s
      timeout: 5s
      retries: 5

  dynamodb-local:
    image: amazon/dynamodb-local:2.5.3
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    ports:
      - "8000:8000"

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

  elasticmq:
    image: softwaremill/elasticmq:1.6.7
    ports:
      - "9324:9324"
    volumes:
      - ./config/elasticmq.conf:/opt/elasticmq.conf
